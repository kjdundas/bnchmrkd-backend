<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>bnchmrkd.</title>
    <!-- Preload the hero background photo -- Lighthouse identifies this as
         the page's Largest Contentful Paint element on desktop, and flagged
         that the browser couldn't discover it until React mounted and
         injected the CSS that references it. This starts the fetch
         immediately, in parallel with the JS bundle. Desktop only -- mobile
         drops the photo entirely (see bnchmarkd-app.jsx), so there's
         nothing to preload there. -->
    <link rel="preload" as="image" href="/hero-stadium.jpg" media="(min-width: 769px)" fetchpriority="high" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Non-render-blocking font load: paints immediately with the fallback
         stack, swaps to the web font once it arrives. A render-blocking
         <link rel="stylesheet"> here would hold up first paint of the
         entire page -- including the boot shell below -- on any latency
         to fonts.googleapis.com, regardless of how fast the rest of the
         connection is. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=DM+Mono:wght@300;400;500&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet" /></noscript>
    <!-- Cloudflare Web Analytics -->
    <script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "8f3569169b1945d9a2a2c1dd6b26933c"}'></script>
    <!-- End Cloudflare Web Analytics -->
    <style>
      /* Instant, JS-free boot shell — shown until React mounts and replaces #root's contents */
      body {
        margin: 0;
        background: linear-gradient(165deg, #F6F7FB 0%, #FFFFFF 35%, #EDEBFE 62%, #F6F7FB 100%);
      }
      #boot-shell {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
      }
      #boot-shell img {
        width: 160px;
        opacity: 1;
      }
      #boot-pulse {
        width: 40px;
        height: 3px;
        border-radius: 2px;
        background: #EDEBFE;
        overflow: hidden;
        opacity: 1;
      }
      #boot-pulse span {
        display: block;
        width: 40%;
        height: 100%;
        background: #4F3CF0;
        border-radius: 2px;
        animation: bootPulseTrack 1.1s ease-in-out infinite;
      }
      @keyframes bootPulseTrack { 0% { transform: translateX(-100%); } 100% { transform: translateX(340%); } }
      @media (prefers-reduced-motion: reduce) {
        #boot-pulse span { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root"><div id="boot-shell"><img src="/bnchmrkd-wordmark.svg" alt="bnchmrkd." /><div id="boot-pulse"><span></span></div></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
